name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_MAVEN_REPOSITORY_URL: ${{ secrets.GOOGLE_MAVEN_REPOSITORY_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.3.13750724" "cmake;3.31.5"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        # Only runs when the KEYSTORE_FILE secret is configured in the repo.
        # Falls back to debug signing when the secret is absent.
        if: ${{ secrets.KEYSTORE_FILE != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > "${{ runner.temp }}/release.jks"
          echo "KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both') }}
        run: ./gradlew assembleRelease --no-daemon
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Package APKs into zip
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          for apk in app/build/outputs/apk/*/*.apk; do
            cp "$apk" artifacts/
          done
          apks=(artifacts/*.apk)
          shopt -u nullglob
          if [ ${#apks[@]} -gt 0 ]; then
            cd artifacts && zip -r ../manus-assistant-apks.zip .
          else
            echo "::error::No APK files were copied into artifacts/ to package. The copy loop did not find files under app/build/outputs/apk; verify build steps completed."
            exit 1
          fi

      - name: Upload APK zip
        uses: actions/upload-artifact@v4
        with:
          name: manus-assistant-apks
          path: manus-assistant-apks.zip
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
